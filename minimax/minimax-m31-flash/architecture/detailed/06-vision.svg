<svg xmlns="http://www.w3.org/2000/svg" width="3480" height="1450" viewBox="0 0 3480 1450" role="img"><title>06-vision</title><rect width="3480" height="1450" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="3478" height="1448" rx="18" fill="#fbfcfe" stroke="#237e76" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">06 视觉全链路：预处理 → Patch Embedding → ViT ×32 → Projector → 2×2 Merger → 占位替换</text>
<line x1="28" y1="75" x2="3452" y2="75" stroke="#237e76" opacity=".35"/>
<rect x="35" y="110" width="1030" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1002" x="550.0" y="145" class="node" text-anchor="middle">图像 / 视频预处理（dynamic resolution）</text>
<text data-max-width="1002" x="550.0" y="180" class="body" text-anchor="middle">单图教学例：处理后 672×672，复制/补齐为 2 帧</text>
<text data-max-width="1002" x="550.0" y="215" class="body" text-anchor="middle">归一化：(pixel/255−mean)/std；按邻接 merge 顺序排 patch</text>
<text data-max-width="1002" x="550.0" y="250" class="body" text-anchor="middle">grid=[1,48,48]；Nv=2304；pixel_values [2304,1176]</text>
<rect x="1215" y="110" width="1030" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1002" x="1730.0" y="145" class="node" text-anchor="middle">Conv3d Patch Embedding：每 patch 一个向量</text>
<text data-max-width="1002" x="1730.0" y="180" class="body" text-anchor="middle">reshape [Nv,3,2,14,14]；W [1280,3,2,14,14]，无 bias</text>
<text data-max-width="1002" x="1730.0" y="215" class="body" text-anchor="middle">kernel=stride=(2,14,14) → [Nv,1280,1,1,1]</text>
<text data-max-width="1002" x="1730.0" y="250" class="body" text-anchor="middle">flatten → [Nv,1280] → Pre LayerNorm [Nv,1280]</text>
<rect x="2395" y="110" width="1050" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1022" x="2920.0" y="145" class="node" text-anchor="middle">ViT 全 32 层：结构相同，权重逐层独立</text>
<text data-max-width="1022" x="2920.0" y="180" class="body" text-anchor="middle">层 0 → 层 1 → … → 层 31，每层 hidden=1280</text>
<text data-max-width="1022" x="2920.0" y="215" class="body" text-anchor="middle">每层两次 LayerNorm + 两次 residual，单层展开如下</text>
<text data-max-width="1022" x="2920.0" y="250" class="body" text-anchor="middle">取最后 encoder 输出；当前实现不应用未训练 post norm</text>
<polyline points="1065,198 1215,198" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="2245,198 2395,198" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="45" y="360" class="node" text-anchor="start">ViT 单层（对应上方 32 层中的任一层）：以下形状以不分片、所有 patch 打包为例</text>
<rect x="35" y="400" width="770" height="212" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="420.0" y="435" class="node" text-anchor="middle">① LN₁ + QKV Linear</text>
<text data-max-width="742" x="420.0" y="470" class="body" text-anchor="middle">输入 [Nv,1,1280]，LN gain/bias [1280]</text>
<text data-max-width="742" x="420.0" y="505" class="body" text-anchor="middle">QKV [Nv,1,3840]</text>
<text data-max-width="742" x="420.0" y="540" class="weight" text-anchor="middle">Wqkv [3840,1280]；bias [3840]</text>
<text data-max-width="742" x="420.0" y="575" class="body" text-anchor="middle">reshape Q/K/V 各 [1,Nv,16,80]</text>
<rect x="915" y="400" width="770" height="212" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="1300.0" y="435" class="node" text-anchor="middle">② Q/K 3D partial RoPE</text>
<text data-max-width="742" x="1300.0" y="470" class="body" text-anchor="middle">时间/高/宽各 26 维，总共旋转 78 维</text>
<text data-max-width="742" x="1300.0" y="505" class="body" text-anchor="middle">head_dim=80，余下 2 维不变；V 不旋转</text>
<text data-max-width="742" x="1300.0" y="540" class="body" text-anchor="middle">cos / sin 各 [Nv,39]；θ=10000</text>
<text data-max-width="742" x="1300.0" y="575" class="weight" text-anchor="middle">Q/K 的 shape 不变，但数值随网格位置改变</text>
<rect x="1795" y="400" width="770" height="212" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="2180.0" y="435" class="node" text-anchor="middle">③ 视觉双向 MHA + O Linear</text>
<text data-max-width="742" x="2180.0" y="470" class="body" text-anchor="middle">每头 QKᵀ/√80 → softmax → V</text>
<text data-max-width="742" x="2180.0" y="505" class="body" text-anchor="middle">[1,Nv,16,80] → [Nv,1,1280]</text>
<text data-max-width="742" x="2180.0" y="540" class="weight" text-anchor="middle">Wo [1280,1280]；bias [1280]</text>
<text data-max-width="742" x="2180.0" y="575" class="body" text-anchor="middle">以片段边界隔离图片/视频，不用语言 MSA</text>
<rect x="2675" y="400" width="770" height="212" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="3060.0" y="435" class="node" text-anchor="middle">④ 残差 + LN₂ + GELU MLP + 残差</text>
<text data-max-width="742" x="3060.0" y="470" class="body" text-anchor="middle">U=X+Attn(LN₁(X))</text>
<text data-max-width="742" x="3060.0" y="505" class="body" text-anchor="middle">[Nv,1,1280] → [Nv,1,5120] → 同输入宽度</text>
<text data-max-width="742" x="3060.0" y="540" class="weight" text-anchor="middle">Wfc1 [5120,1280]；Wfc2 [1280,5120]</text>
<text data-max-width="742" x="3060.0" y="575" class="body" text-anchor="middle">Y=U+MLP(LN₂(U)) → 下一 ViT 层</text>
<polyline points="805,506 915,506" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1685,506 1795,506" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="2565,506 2675,506" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="45" y="685" class="node" text-anchor="start">视觉塔输出 → 对齐文本通道 → 压缩空间 token → 替换语言占位：顺序不可交换</text>
<rect x="35" y="730" width="770" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="420.0" y="765" class="node" text-anchor="middle">ViT 最后输出</text>
<text data-max-width="742" x="420.0" y="800" class="body" text-anchor="middle">V [Nv,1280]</text>
<text data-max-width="742" x="420.0" y="835" class="body" text-anchor="middle">教学例：[2304,1280]</text>
<text data-max-width="742" x="420.0" y="870" class="weight" text-anchor="middle">不添加 CLS；LayerNorm 与文本 RMSNorm 不同</text>
<rect x="915" y="730" width="770" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="1300.0" y="765" class="node" text-anchor="middle">Projector：两层 Linear + GELU</text>
<text data-max-width="742" x="1300.0" y="800" class="body" text-anchor="middle">1280 → 6144 → 6144，token 数不变</text>
<text data-max-width="742" x="1300.0" y="835" class="weight" text-anchor="middle">W₁ [6144,1280]；W₂ [6144,6144]</text>
<text data-max-width="742" x="1300.0" y="870" class="body" text-anchor="middle">[2304,1280] → [2304,6144]</text>
<rect x="1795" y="730" width="770" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="2180.0" y="765" class="node" text-anchor="middle">2×2 空间拼接 → 两层 Merge MLP</text>
<text data-max-width="742" x="2180.0" y="800" class="body" text-anchor="middle">[Nv,6144] → [Nv/4,24576]（只重排）</text>
<text data-max-width="742" x="2180.0" y="835" class="weight" text-anchor="middle">W₁ [6144,24576]；W₂ [6144,6144]</text>
<text data-max-width="742" x="2180.0" y="870" class="body" text-anchor="middle">GELU；教学例最终 [576,6144]</text>
<rect x="2675" y="730" width="770" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="742" x="3060.0" y="765" class="node" text-anchor="middle">按位置替换语言 embedding</text>
<text data-max-width="742" x="3060.0" y="800" class="body" text-anchor="middle">视觉向量 [Nv/4,6144] → 同宽占位位置</text>
<text data-max-width="742" x="3060.0" y="835" class="body" text-anchor="middle">100 个非视觉 token + 576 个图像位置</text>
<text data-max-width="742" x="3060.0" y="870" class="body" text-anchor="middle">→ [676,6144] → 语言第 0 层（01 / 03）</text>
<polyline points="805,818 915,818" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1685,818 1795,818" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="2565,818 2675,818" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="960" width="1650" height="177" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1622" x="860.0" y="995" class="node" text-anchor="middle">图像数值流转：像素归一化会改值，patchify/reshape 只重排</text>
<text data-max-width="1622" x="860.0" y="1030" class="body" text-anchor="middle">Conv / Linear / GELU / Norm / attention / residual 都参与数值计算</text>
<text data-max-width="1622" x="860.0" y="1065" class="body" text-anchor="middle">2×2 拼接后 4×6144=24576；可训练 MLP 才压缩到 6144，不是求均值</text>
<text data-max-width="1622" x="860.0" y="1100" class="body" text-anchor="middle">所有 projector / merger bias 均为 [6144]；ViT FFN bias 为 [5120]、[1280]</text>
<rect x="1795" y="960" width="1650" height="177" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1622" x="2620.0" y="995" class="node" text-anchor="middle">视频教学例：已采样/补齐 8 帧，处理后每帧 672×672</text>
<text data-max-width="1622" x="2620.0" y="1030" class="body" text-anchor="middle">grid=[4,48,48] → Nv=9216 → pixels [9216,1176] → [2304,6144]</text>
<text data-max-width="1622" x="2620.0" y="1065" class="body" text-anchor="middle">temporal patch=2 先压时间；2×2 merger 仅压空间；时间戳等控制 token 另计</text>
<text data-max-width="1622" x="2620.0" y="1100" class="body" text-anchor="middle">当前实现按时间 grid 每 4 组限段；长视频分段双向 attention，段间隔离</text>
<rect x="35" y="1190" width="3410" height="137" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="3382" x="1740.0" y="1225" class="node" text-anchor="middle">层级覆盖：视觉 Patch Embed ×1 → Pre LN ×1 → Vision Transformer ×32 → Projector ×1 → Merger ×1 → 文本 60 层 → Final Norm → LM Head</text>
<text data-max-width="3382" x="1740.0" y="1260" class="body" text-anchor="middle">图中的 Nv/4 与 576 都是视觉内容向量数量；实际 dynamic resolution 以 grid 为准，672 不代表固定输入尺寸。</text>
<text data-max-width="3382" x="1740.0" y="1295" class="body" text-anchor="middle">视频/图片在 prefill 时变成语言前缀；正常后续 decode 复用语言 KV cache，通常不逐 token 重跑同一份视觉输入。</text></svg>