<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2220" viewBox="0 0 1420 2220" role="img"><title>02-dense-layer</title><rect width="1420" height="2220" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="1418" height="2218" rx="18" fill="#fbfcfe" stroke="#7758a6" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">02 前 3 层：MSA + Dense FFN，展开一层</text>
<line x1="28" y1="75" x2="1392" y2="75" stroke="#7758a6" opacity=".35"/>
<rect x="330" y="110" width="760" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="145" class="node" text-anchor="middle">同一序列：语言 token + 视觉 token 的向量</text>
<text data-max-width="732" x="710.0" y="180" class="body" text-anchor="middle">Xℓ [N,6144]；进入层后不按模态分两条专家路</text>
<polyline points="710,212 710,250" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="330" y="250" width="760" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="285" class="node" text-anchor="middle">Norm₁：GemmaRMSNorm [N,6144]</text>
<text data-max-width="732" x="710.0" y="320" class="weight" text-anchor="middle">W [6144]；ε=10⁻⁶；增益 1+W</text>
<polyline points="710,352 710,390" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="330" y="390" width="760" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="425" class="node" text-anchor="middle">MSA：token 间的信息交互（见 04、05）</text>
<text data-max-width="732" x="710.0" y="460" class="body" text-anchor="middle">输入 [N,6144] → A [N,6144]</text>
<polyline points="710,492 710,530" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="710" cy="550" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="710" y="558" class="node" text-anchor="middle">+</text>
<polyline points="330,161 35,161 35,550 690,550" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="48" y="520" class="small" text-anchor="start">原 Xℓ 残差</text>
<polyline points="710,570 710,610" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="330" y="610" width="760" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="645" class="node" text-anchor="middle">U=Xℓ+A；Z=Norm₂(U) [N,6144]</text>
<text data-max-width="732" x="710.0" y="680" class="weight" text-anchor="middle">第二套独立 Norm 权重 [6144]；Z 进入 Dense FFN</text>
<rect x="330" y="765" width="760" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="800" class="node" text-anchor="middle">Dense FFN 输入 Z [N,6144]</text>
<polyline points="710,712 710,765" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="710,833 710,863 345,863 345,900" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="710,863 1075,863 1075,900" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="95" y="900" width="500" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="472" x="345.0" y="935" class="node" text-anchor="middle">Gate Linear</text>
<text data-max-width="472" x="345.0" y="970" class="body" text-anchor="middle">G [N,12288]</text>
<text data-max-width="472" x="345.0" y="1005" class="weight" text-anchor="middle">Wgate [12288,6144]</text>
<rect x="825" y="900" width="500" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="472" x="1075.0" y="935" class="node" text-anchor="middle">Up Linear</text>
<text data-max-width="472" x="1075.0" y="970" class="body" text-anchor="middle">V [N,12288]</text>
<text data-max-width="472" x="1075.0" y="1005" class="weight" text-anchor="middle">Wup [12288,6144]</text>
<rect x="330" y="1110" width="760" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="1145" class="node" text-anchor="middle">SwiGLU-OAI：逐通道门控相乘</text>
<text data-max-width="732" x="710.0" y="1180" class="body" text-anchor="middle">G′=min(G,7)；V′=clamp(V,−7,7)</text>
<text data-max-width="732" x="710.0" y="1215" class="body" text-anchor="middle">G′×sigmoid(1.702G′)×(V′+1)</text>
<text data-max-width="732" x="710.0" y="1250" class="body" text-anchor="middle">输出 [N,12288]</text>
<polyline points="345,1037 345,1070 530,1070 530,1110" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1075,1037 1075,1070 890,1070 890,1110" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="710,1287 710,1330" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="330" y="1330" width="760" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="1365" class="node" text-anchor="middle">Down Linear → F [N,6144]</text>
<text data-max-width="732" x="710.0" y="1400" class="weight" text-anchor="middle">Wdown [6144,12288]</text>
<rect x="95" y="1510" width="500" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="472" x="345.0" y="1545" class="node" text-anchor="middle">所有有效 token 走同一套 FFN</text>
<text data-max-width="472" x="345.0" y="1580" class="body" text-anchor="middle">语言/视觉位置都不跳过</text>
<text data-max-width="472" x="345.0" y="1615" class="body" text-anchor="middle">不做专家选择，没有 router</text>
<rect x="825" y="1510" width="500" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="472" x="1075.0" y="1545" class="node" text-anchor="middle">本层只做逐 token 通道加工</text>
<text data-max-width="472" x="1075.0" y="1580" class="body" text-anchor="middle">不同位置用同一套本层权重</text>
<text data-max-width="472" x="1075.0" y="1615" class="body" text-anchor="middle">不同层的权重仍彼此独立</text>
<polyline points="710,1432 710,1770" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="710" cy="1790" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="710" y="1798" class="node" text-anchor="middle">+</text>
<polyline points="1090,645 1370,645 1370,1790 730,1790" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1150" y="1750" class="small" text-anchor="start">U 残差</text>
<polyline points="710,1810 710,1850" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="330" y="1850" width="760" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="710.0" y="1885" class="node" text-anchor="middle">Xℓ⁺¹=U+F [N,6144]</text>
<text data-max-width="732" x="710.0" y="1920" class="body" text-anchor="middle">依次完成层 0、1、2 → 进入 MoE 层 3</text>
<rect x="95" y="1995" width="1230" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1202" x="710.0" y="2030" class="node" text-anchor="middle">Dense 的含义：FFN 不做专家稀疏路由</text>
<text data-max-width="1202" x="710.0" y="2065" class="body" text-anchor="middle">它的 attention 仍然是 MSA，不是全量 dense attention。</text>
<text data-max-width="1202" x="710.0" y="2100" class="body" text-anchor="middle">FFN 中间宽度 I=12288；输出宽度回到 6144，可与 U 相加。</text></svg>