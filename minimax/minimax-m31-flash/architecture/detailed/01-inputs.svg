<svg xmlns="http://www.w3.org/2000/svg" width="3480" height="490" viewBox="0 0 3480 490" role="img"><title>01-inputs</title><rect width="3480" height="490" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="3478" height="488" rx="18" fill="#fbfcfe" stroke="#447da5" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">01 入参 → Embedding → 多模态序列：先分清 ID、位置、像素与缓存元数据</text>
<line x1="28" y1="75" x2="3452" y2="75" stroke="#447da5" opacity=".35"/>
<rect x="40" y="110" width="760" height="172" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="420.0" y="145" class="node" text-anchor="middle">文本输入</text>
<text data-max-width="732" x="420.0" y="180" class="body" text-anchor="middle">input_ids [B,S] / 打包 [N]，整数</text>
<text data-max-width="732" x="420.0" y="215" class="body" text-anchor="middle">positions [N]：Pᵢ … Pᵢ+Sᵢ−1</text>
<text data-max-width="732" x="420.0" y="250" class="body" text-anchor="middle">mask / seq_lens / 请求边界</text>
<rect x="910" y="110" width="760" height="172" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="1290.0" y="145" class="node" text-anchor="middle">Embedding 查表</text>
<text data-max-width="732" x="1290.0" y="180" class="body" text-anchor="middle">W_E [200064,6144]</text>
<text data-max-width="732" x="1290.0" y="215" class="body" text-anchor="middle">IDs → X_text [N,6144]</text>
<text data-max-width="732" x="1290.0" y="250" class="weight" text-anchor="middle">查表取行；权重在推理中保持不变</text>
<rect x="1780" y="110" width="760" height="172" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="732" x="2160.0" y="145" class="node" text-anchor="middle">视觉输入 → 视觉塔（见 06）</text>
<text data-max-width="732" x="2160.0" y="180" class="body" text-anchor="middle">pixel_values [Nv,1176]；1176=3×2×14²</text>
<text data-max-width="732" x="2160.0" y="215" class="body" text-anchor="middle">grid_thw [图像/视频数,3]</text>
<text data-max-width="732" x="2160.0" y="250" class="body" text-anchor="middle">→ V_mm [Nv/4,6144]</text>
<rect x="2650" y="110" width="790" height="172" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="762" x="3045.0" y="145" class="node" text-anchor="middle">对应占位位置替换</text>
<text data-max-width="762" x="3045.0" y="180" class="body" text-anchor="middle">image ID=200025 / video ID=200026</text>
<text data-max-width="762" x="3045.0" y="215" class="body" text-anchor="middle">X [N,6144] → 语言主干（见 03）</text>
<text data-max-width="762" x="3045.0" y="250" class="weight" text-anchor="middle">视觉向量数必须等于展开后的占位数</text>
<polyline points="800,196 910,196" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1670,196 1720,196 1720,320 3045,320 3045,282" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="2540,196 2650,196" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="353" width="1630" height="103" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1602" x="855.0" y="388" class="node" text-anchor="middle">符号：N=ΣSᵢ 为本轮有效 token 数；Pᵢ 为已有历史；Tᵢ=Pᵢ+Sᵢ</text>
<text data-max-width="1602" x="855.0" y="423" class="body" text-anchor="middle">Nv=merge 前的视觉 patch 数；矩形示例 N=B×S；下图默认不切 TP/EP</text>
<rect x="1780" y="353" width="1660" height="103" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1632" x="2610.0" y="388" class="node" text-anchor="middle">slot_mapping [N] → 新 K/V 的写入槽；block_table [B,Mcache] → 历史地址</text>
<text data-max-width="1632" x="2610.0" y="423" class="body" text-anchor="middle">本轮激活与逐层 KV cache 独立；物理分页布局由后端决定（见 07）</text></svg>