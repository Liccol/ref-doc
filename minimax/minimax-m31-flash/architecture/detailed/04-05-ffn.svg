<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1940" viewBox="0 0 1120 1940" role="img"><title>04-05-ffn</title><rect width="1120" height="1940" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="1118" height="1938" rx="18" fill="#fbfcfe" stroke="#4b853e" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">04 / 05 FFN：三层 Dense + 五十七层 MoE</text>
<line x1="28" y1="75" x2="1092" y2="75" stroke="#4b853e" opacity=".35"/>
<rect x="90" y="110" width="940" height="212" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="912" x="560.0" y="145" class="node" text-anchor="middle">04 Dense：仅层 0、1、2，每层独立权重</text>
<text data-max-width="912" x="560.0" y="180" class="body" text-anchor="middle">输入 Z [N,6144] → gate/up 各 [N,12288]</text>
<text data-max-width="912" x="560.0" y="215" class="weight" text-anchor="middle">Wgate / Wup 各 [12288,6144]；融合宽度 24576</text>
<text data-max-width="912" x="560.0" y="250" class="body" text-anchor="middle">SwiGLU-OAI [N,12288] → down → F [N,6144]</text>
<text data-max-width="912" x="560.0" y="285" class="weight" text-anchor="middle">Wdown [6144,12288]；F 返回主干残差加法</text>
<text x="560" y="380" class="node" text-anchor="middle">05 MoE：层 3 … 59，以下完整展开一层</text>
<rect x="235" y="415" width="650" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="622" x="560.0" y="450" class="node" text-anchor="middle">输入 Z [N,6144]</text>
<polyline points="560,483 560,515 315,515 315,550" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="560,515 900,515 900,550" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="550" width="540" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="512" x="315.0" y="585" class="node" text-anchor="middle">Router Linear（FP32）</text>
<text data-max-width="512" x="315.0" y="620" class="body" text-anchor="middle">Wrouter [128,6144] → logits [N,128]</text>
<text data-max-width="512" x="315.0" y="655" class="body" text-anchor="middle">sigmoid → s [N,128]</text>
<rect x="665" y="550" width="415" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="387" x="872.5" y="585" class="node" text-anchor="middle">1 个 Shared Expert</text>
<text data-max-width="387" x="872.5" y="620" class="body" text-anchor="middle">每个 token 都经过</text>
<text data-max-width="387" x="872.5" y="655" class="body" text-anchor="middle">输入 [N,6144]</text>
<polyline points="315,687 315,725" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="725" width="540" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="512" x="315.0" y="760" class="node" text-anchor="middle">Top-4：按 s + correction bias 选</text>
<text data-max-width="512" x="315.0" y="795" class="body" text-anchor="middle">bias [128]；expert IDs [N,4]</text>
<text data-max-width="512" x="315.0" y="830" class="body" text-anchor="middle">取原始 s，归一化成 r [N,4]</text>
<text data-max-width="512" x="315.0" y="865" class="weight" text-anchor="middle">不是对加 bias 的分数做输出加权</text>
<polyline points="315,902 315,940" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="940" width="540" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="512" x="315.0" y="975" class="node" text-anchor="middle">Dispatch：按 expert ID 分组</text>
<text data-max-width="512" x="315.0" y="1010" class="body" text-anchor="middle">总任务数 4N；expert e 收 nₑ 行</text>
<text data-max-width="512" x="315.0" y="1045" class="body" text-anchor="middle">Zₑ [nₑ,6144]；Σnₑ=4N</text>
<polyline points="315,1077 315,1115" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="1115" width="540" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="512" x="315.0" y="1150" class="node" text-anchor="middle">选中专家的 FFN（128 中取 4）</text>
<text data-max-width="512" x="315.0" y="1185" class="body" text-anchor="middle">gate/up 各 [nₑ,3072] → 激活</text>
<text data-max-width="512" x="315.0" y="1220" class="body" text-anchor="middle">→ down → Yₑ [nₑ,6144]</text>
<text data-max-width="512" x="315.0" y="1255" class="weight" text-anchor="middle">W1/W3 [3072,6144]；W2 [6144,3072]</text>
<polyline points="900,687 900,1115" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="665" y="1115" width="415" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="387" x="872.5" y="1150" class="node" text-anchor="middle">共享 FFN</text>
<text data-max-width="387" x="872.5" y="1185" class="body" text-anchor="middle">6144 → 3072 → 6144</text>
<text data-max-width="387" x="872.5" y="1220" class="body" text-anchor="middle">输出 [N,6144]</text>
<text data-max-width="387" x="872.5" y="1255" class="weight" text-anchor="middle">权重维度同单个路由专家</text>
<polyline points="315,1292 315,1330" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="1330" width="540" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="512" x="315.0" y="1365" class="node" text-anchor="middle">Combine：按原 token 顺序回收</text>
<text data-max-width="512" x="315.0" y="1400" class="body" text-anchor="middle">Rₙ=2.0×Σₖ rₙₖ·Yₙₖ</text>
<text data-max-width="512" x="315.0" y="1435" class="body" text-anchor="middle">路由输出 R [N,6144]</text>
<circle cx="630" cy="1510" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="630" y="1518" class="node" text-anchor="middle">+</text>
<polyline points="315,1467 315,1510 610,1510" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="900,1292 900,1510 650,1510" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="630,1530 630,1560" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="175" y="1560" width="910" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="882" x="630.0" y="1595" class="node" text-anchor="middle">F=R+Shared [N,6144] → 返回 03 的第二次残差加法</text>
<rect x="45" y="1670" width="1035" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1007" x="562.5" y="1705" class="node" text-anchor="middle">Dense / Routed / Shared 共用同一种 SwiGLU-OAI</text>
<text data-max-width="1007" x="562.5" y="1740" class="body" text-anchor="middle">g′=min(g,7)；u′=clamp(u,−7,7)</text>
<text data-max-width="1007" x="562.5" y="1775" class="body" text-anchor="middle">activation=g′×sigmoid(1.702g′)×(u′+1)</text>
<text data-max-width="1007" x="562.5" y="1810" class="weight" text-anchor="middle">最后一维从 2I → I；Dense I=12288，Expert I=3072</text>
<text x="40" y="1895" class="small" text-anchor="start">共享专家不占 Top-4 名额；每 token 为 4 路由 + 1 共享。</text></svg>