<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2220" viewBox="0 0 2000 2220" role="img"><title>03-moe-layer</title><rect width="2000" height="2220" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="1998" height="2218" rx="18" fill="#fbfcfe" stroke="#4b853e" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">03 后 57 层：MSA + MoE，展开一层的两条专家路</text>
<line x1="28" y1="75" x2="1972" y2="75" stroke="#4b853e" opacity=".35"/>
<rect x="500" y="110" width="1000" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="972" x="1000.0" y="145" class="node" text-anchor="middle">同一序列：语言 token + 视觉 token 的向量</text>
<text data-max-width="972" x="1000.0" y="180" class="body" text-anchor="middle">Xℓ [N,6144]；进入层后不按模态分两条专家路</text>
<polyline points="1000,212 1000,250" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500" y="250" width="1000" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="972" x="1000.0" y="285" class="node" text-anchor="middle">Norm₁：GemmaRMSNorm [N,6144]</text>
<text data-max-width="972" x="1000.0" y="320" class="weight" text-anchor="middle">W [6144]；ε=10⁻⁶；增益 1+W</text>
<polyline points="1000,352 1000,390" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500" y="390" width="1000" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="972" x="1000.0" y="425" class="node" text-anchor="middle">MSA：token 间的信息交互（见 04、05）</text>
<text data-max-width="972" x="1000.0" y="460" class="body" text-anchor="middle">输入 [N,6144] → A [N,6144]</text>
<polyline points="1000,492 1000,530" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="1000" cy="550" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="1000" y="558" class="node" text-anchor="middle">+</text>
<polyline points="500,161 35,161 35,550 980,550" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="48" y="520" class="small" text-anchor="start">原 Xℓ 残差</text>
<polyline points="1000,570 1000,610" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500" y="610" width="1000" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="972" x="1000.0" y="645" class="node" text-anchor="middle">U=Xℓ+A；Z=Norm₂(U) [N,6144]</text>
<text data-max-width="972" x="1000.0" y="680" class="weight" text-anchor="middle">第二套独立 Norm 权重 [6144]；Z 进入 MoE</text>
<polyline points="1000,712 1000,765" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="650" y="765" width="700" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="672" x="1000.0" y="800" class="node" text-anchor="middle">同一份 Z [N,6144] 同时送两条分支</text>
<polyline points="1000,833 1000,860 590,860 590,900" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1000,860 1605,860 1605,900" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75" y="900" width="1030" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1002" x="590.0" y="935" class="node" text-anchor="middle">路由分支：Router Linear → sigmoid</text>
<text data-max-width="1002" x="590.0" y="970" class="body" text-anchor="middle">Wrouter [128,6144]（FP32）→ scores s [N,128]</text>
<text data-max-width="1002" x="590.0" y="1005" class="body" text-anchor="middle">按 s + correction_bias [128] 为每 token 选 Top-4</text>
<rect x="1295" y="900" width="630" height="137" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="602" x="1610.0" y="935" class="node" text-anchor="middle">共享分支：1 个 Shared Expert</text>
<text data-max-width="602" x="1610.0" y="970" class="body" text-anchor="middle">不经过 router，不占 Top-4 名额</text>
<text data-max-width="602" x="1610.0" y="1005" class="body" text-anchor="middle">每一个 token 都进入此分支</text>
<polyline points="590,1037 590,1075" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75" y="1075" width="1030" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1002" x="590.0" y="1110" class="node" text-anchor="middle">IDs [N,4]；取原始 s 并归一化 → r [N,4]</text>
<text data-max-width="1002" x="590.0" y="1145" class="body" text-anchor="middle">Dispatch：将 token 按选中的 expert 分组</text>
<text data-max-width="1002" x="590.0" y="1180" class="body" text-anchor="middle">Σnₑ=4N；每个 expert e 收到 Zₑ [nₑ,6144]</text>
<polyline points="590,1212 590,1250" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75" y="1250" width="1030" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1002" x="590.0" y="1285" class="node" text-anchor="middle">128 个独立路由专家中，每 token 只计算选中的 4 个</text>
<text data-max-width="1002" x="590.0" y="1320" class="body" text-anchor="middle">每个专家：6144 → gate/up 各 3072 → 激活 → down 6144</text>
<text data-max-width="1002" x="590.0" y="1355" class="weight" text-anchor="middle">W1/W3 [3072,6144]；W2 [6144,3072]</text>
<text data-max-width="1002" x="590.0" y="1390" class="body" text-anchor="middle">专家输出 Yₑ [nₑ,6144]，保留原 token ID 用于回收</text>
<polyline points="1610,1037 1610,1250" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1295" y="1250" width="630" height="177" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="602" x="1610.0" y="1285" class="node" text-anchor="middle">Shared FFN</text>
<text data-max-width="602" x="1610.0" y="1320" class="body" text-anchor="middle">[N,6144] → gate/up 各 [N,3072]</text>
<text data-max-width="602" x="1610.0" y="1355" class="body" text-anchor="middle">→ SwiGLU-OAI → down</text>
<text data-max-width="602" x="1610.0" y="1390" class="body" text-anchor="middle">Shared(Z) [N,6144]</text>
<polyline points="590,1427 590,1465" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75" y="1465" width="1030" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1002" x="590.0" y="1500" class="node" text-anchor="middle">Combine：按原 token ID 回收四个专家结果</text>
<text data-max-width="1002" x="590.0" y="1535" class="body" text-anchor="middle">Rₙ=2.0×Σₖ rₙₖ·Yₙₖ → R [N,6144]</text>
<text data-max-width="1002" x="590.0" y="1570" class="body" text-anchor="middle">权重只用于路由分支；共享输出不乘 routed factor</text>
<circle cx="1000" cy="1660" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="1000" y="1668" class="node" text-anchor="middle">+</text>
<polyline points="590,1602 590,1660 980,1660" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1610,1427 1610,1660 1020,1660" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1000,1680 1000,1710" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="650" y="1710" width="700" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="672" x="1000.0" y="1745" class="node" text-anchor="middle">F=R+Shared(Z) [N,6144]</text>
<polyline points="1000,1778 1000,1790" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="1000" cy="1810" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="1000" y="1818" class="node" text-anchor="middle">+</text>
<polyline points="1500,645 1960,645 1960,1810 1020,1810" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1760" y="1775" class="small" text-anchor="start">U 残差</text>
<polyline points="1000,1830 1000,1860" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500" y="1860" width="1000" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="972" x="1000.0" y="1895" class="node" text-anchor="middle">Xℓ⁺¹=U+F [N,6144]</text>
<text data-max-width="972" x="1000.0" y="1930" class="body" text-anchor="middle">重复至层 59 完成 → Final Norm → LM Head</text>
<rect x="75" y="2000" width="1850" height="137" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1822" x="1000.0" y="2035" class="node" text-anchor="middle">不是“语言 token 走路由、视觉 token 走共享”：两类 token 都同时进入 router 和共享分支。</text>
<text data-max-width="1822" x="1000.0" y="2070" class="body" text-anchor="middle">路由选择取决于该 token 当时的 hidden state；不同 token 可以选择不同的 4 个专家。</text>
<text data-max-width="1822" x="1000.0" y="2105" class="body" text-anchor="middle">与 Dense 相比：变化在 FFN 内部；层输入、MSA、两次 Norm/残差及输出 shape 保持同类结构。</text></svg>