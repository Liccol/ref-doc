<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1940" viewBox="0 0 1120 1940" role="img"><title>03-decoder</title><rect width="1120" height="1940" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="1118" height="1938" rx="18" fill="#fbfcfe" stroke="#7758a6" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">03 语言主干：完整层级 + 一层的两次残差</text>
<line x1="28" y1="75" x2="1092" y2="75" stroke="#7758a6" opacity=".35"/>
<rect x="160" y="105" width="800" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="772" x="560.0" y="140" class="node" text-anchor="middle">合并后的 X⁰ [N,6144]</text>
<text data-max-width="772" x="560.0" y="175" class="body" text-anchor="middle">Embedding / 视觉替换输出（01）</text>
<polyline points="560,207 560,245" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="160" y="245" width="800" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="772" x="560.0" y="280" class="node" text-anchor="middle">层 0、1、2：MSA + Dense FFN ×3</text>
<text data-max-width="772" x="560.0" y="315" class="body" text-anchor="middle">结构相同，权重各层独立；Dense 展开见 04</text>
<polyline points="560,347 560,385" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="160" y="385" width="800" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="772" x="560.0" y="420" class="node" text-anchor="middle">层 3 … 59：MSA + MoE ×57</text>
<text data-max-width="772" x="560.0" y="455" class="body" text-anchor="middle">结构相同，权重各层独立；MoE 展开见 05</text>
<text x="560" y="540" class="node" text-anchor="middle">下方为任意一层 ℓ 的等价逻辑前向</text>
<rect x="230" y="575" width="660" height="68" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="632" x="560.0" y="610" class="node" text-anchor="middle">层输入 Xℓ [N,6144]</text>
<polyline points="560,643 560,685" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="230" y="685" width="660" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="632" x="560.0" y="720" class="node" text-anchor="middle">Norm₁：GemmaRMSNorm</text>
<text data-max-width="632" x="560.0" y="755" class="body" text-anchor="middle">H=Norm₁(Xℓ) [N,6144]</text>
<text data-max-width="632" x="560.0" y="790" class="weight" text-anchor="middle">W [6144]；ε=10⁻⁶；增益=1+W</text>
<polyline points="560,822 560,860" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="230" y="860" width="660" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="632" x="560.0" y="895" class="node" text-anchor="middle">MSA（完整展开见左侧 02）</text>
<text data-max-width="632" x="560.0" y="930" class="body" text-anchor="middle">H [N,6144] → A [N,6144]</text>
<polyline points="560,962 560,1005" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="560" cy="1025" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="560" y="1033" class="node" text-anchor="middle">+</text>
<polyline points="230,609 105,609 105,1025 540,1025" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="115" y="993" class="small" text-anchor="start">Xℓ 残差</text>
<polyline points="560,1045 560,1080" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="230" y="1080" width="660" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="632" x="560.0" y="1115" class="node" text-anchor="middle">U=Xℓ+A [N,6144]</text>
<text data-max-width="632" x="560.0" y="1150" class="body" text-anchor="middle">Norm₂(U) → Z [N,6144]</text>
<text data-max-width="632" x="560.0" y="1185" class="weight" text-anchor="middle">独立 W [6144]，形状保持、数值归一化</text>
<polyline points="560,1217 560,1255" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="230" y="1255" width="660" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="632" x="560.0" y="1290" class="node" text-anchor="middle">按层选择 FFN（右侧 04 / 05）</text>
<text data-max-width="632" x="560.0" y="1325" class="body" text-anchor="middle">0–2：Dense；3–59：MoE</text>
<text data-max-width="632" x="560.0" y="1360" class="body" text-anchor="middle">Z [N,6144] → F [N,6144]</text>
<polyline points="560,1392 560,1430" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="560" cy="1450" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="560" y="1458" class="node" text-anchor="middle">+</text>
<polyline points="890,1115 1015,1115 1015,1450 580,1450" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="900" y="1418" class="small" text-anchor="start">U 残差</text>
<polyline points="560,1470 560,1505" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="230" y="1505" width="660" height="102" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="632" x="560.0" y="1540" class="node" text-anchor="middle">Xℓ⁺¹=U+F [N,6144]</text>
<text data-max-width="632" x="560.0" y="1575" class="body" text-anchor="middle">送下一层；直到第 59 层完成</text>
<polyline points="560,1607 560,1640" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="160" y="1640" width="800" height="137" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="772" x="560.0" y="1675" class="node" text-anchor="middle">Final GemmaRMSNorm → 选定位置 [R,6144]</text>
<text data-max-width="772" x="560.0" y="1710" class="body" text-anchor="middle">LM Head：W [200064,6144]（与 Embedding 独立）</text>
<text data-max-width="772" x="560.0" y="1745" class="body" text-anchor="middle">logits [R,200064] → 采样 ID → 下一轮查 Embedding</text>
<text x="40" y="1822" class="small" text-anchor="start">普通生成 R=B；全位置输出 R=N。返回采样 ID 为整数。</text>
<text x="40" y="1860" class="small" text-anchor="start">融合实现可返回 F 与 residual=U，下一层 Norm 才相加。</text>
<text x="40" y="1898" class="small" text-anchor="start">图中展开为数学等价加法；不要额外重复添加残差。</text></svg>