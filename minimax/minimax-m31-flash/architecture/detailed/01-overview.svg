<svg xmlns="http://www.w3.org/2000/svg" width="3480" height="830" viewBox="0 0 3480 830" role="img"><title>01-overview</title><rect width="3480" height="830" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="3478" height="828" rx="18" fill="#fbfcfe" stroke="#447da5" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">01 先看执行顺序：视觉先编码 → 两类 token 合流 → 前 3 层 → 后 57 层 → 输出</text>
<line x1="28" y1="75" x2="3452" y2="75" stroke="#447da5" opacity=".35"/>
<rect x="40" y="110" width="700" height="137" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="672" x="390.0" y="145" class="node" text-anchor="middle">语言 token IDs</text>
<text data-max-width="672" x="390.0" y="180" class="body" text-anchor="middle">input_ids [B,S] / 打包 [N]</text>
<text data-max-width="672" x="390.0" y="215" class="body" text-anchor="middle">整数 ID，含视觉占位位置</text>
<rect x="860" y="110" width="700" height="137" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="672" x="1210.0" y="145" class="node" text-anchor="middle">文本 Embedding</text>
<text data-max-width="672" x="1210.0" y="180" class="body" text-anchor="middle">W_E [200064,6144]</text>
<text data-max-width="672" x="1210.0" y="215" class="body" text-anchor="middle">→ 文本位置的向量 [N_text,6144]</text>
<rect x="1770" y="110" width="700" height="137" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="672" x="2120.0" y="145" class="node" text-anchor="middle">图像 / 视频</text>
<text data-max-width="672" x="2120.0" y="180" class="body" text-anchor="middle">pixels [Nv,1176] + grid_thw</text>
<text data-max-width="672" x="2120.0" y="215" class="body" text-anchor="middle">先经视觉塔；不直接输入语言层</text>
<rect x="2630" y="110" width="810" height="137" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="782" x="3035.0" y="145" class="node" text-anchor="middle">独立视觉塔（完整展开见 06）</text>
<text data-max-width="782" x="3035.0" y="180" class="body" text-anchor="middle">Patch Embed → ViT ×32 → Projector → Merger</text>
<text data-max-width="782" x="3035.0" y="215" class="body" text-anchor="middle">→ 视觉 token 向量 [N_visual,6144]</text>
<polyline points="740,178 860,178" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="2470,178 2630,178" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1040" y="350" width="1400" height="137" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1372" x="1740.0" y="385" class="node" text-anchor="middle">按占位位置合并，形成同一条序列 X⁰ [N,6144]</text>
<text data-max-width="1372" x="1740.0" y="420" class="body" text-anchor="middle">示意：[语言向量] [视觉向量] [视觉向量] [语言向量]</text>
<text data-max-width="1372" x="1740.0" y="455" class="body" text-anchor="middle">N=N_text+N_visual；边界符等非视觉位置计入 N_text</text>
<polyline points="1210,247 1210,350" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="3035,247 3035,418 2440,418" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="575" width="960" height="177" rx="10" fill="#f3eef9" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="932" x="520.0" y="610" class="node" text-anchor="middle">前 3 层：0、1、2（单独展开见 02）</text>
<text data-max-width="932" x="520.0" y="645" class="body" text-anchor="middle">MSA + Dense FFN ×3</text>
<text data-max-width="932" x="520.0" y="680" class="body" text-anchor="middle">两类 token 都经过相同的层内流程</text>
<text data-max-width="932" x="520.0" y="715" class="body" text-anchor="middle">[N,6144] → [N,6144]</text>
<rect x="1160" y="575" width="1080" height="177" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1052" x="1700.0" y="610" class="node" text-anchor="middle">后 57 层：3 … 59（单独展开见 03）</text>
<text data-max-width="1052" x="1700.0" y="645" class="body" text-anchor="middle">MSA + MoE ×57</text>
<text data-max-width="1052" x="1700.0" y="680" class="body" text-anchor="middle">每 token：Top-4 路由专家 + 1 共享专家</text>
<text data-max-width="1052" x="1700.0" y="715" class="body" text-anchor="middle">[N,6144] → [N,6144]</text>
<rect x="2390" y="575" width="1050" height="177" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="1022" x="2915.0" y="610" class="node" text-anchor="middle">Final Norm → LM Head → 采样</text>
<text data-max-width="1022" x="2915.0" y="645" class="body" text-anchor="middle">选定位置 [R,6144] → logits [R,200064]</text>
<text data-max-width="1022" x="2915.0" y="680" class="body" text-anchor="middle">采样新语言 token ID → 下一轮 Embedding</text>
<text data-max-width="1022" x="2915.0" y="715" class="body" text-anchor="middle">普通生成 R=B；全位置输出 R=N</text>
<polyline points="1740,487 1740,530 520,530 520,575" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1000,663 1160,663" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="2240,663 2390,663" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="40" y="800" class="small" text-anchor="start">层内权重和 KV 内容各层独立；同构层只展开一次。positions / 长度 / slot_mapping / block_table 随请求传入，见 04。</text></svg>