<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1610" viewBox="0 0 2800 1610">
<rect width="2800" height="1610" fill="white"/>
<style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs>
<text x="1400" y="65" class="title" text-anchor="middle">MiniMax-M3.1 · MSA Index Branch</text>
<text x="1400" y="115" class="body" text-anchor="middle">自下向上：索引投影 → token 评分 → 块内 max → 按组 Top-K → block 索引</text>
<g transform="translate(60,170)"><rect x="1" y="1" width="2678" height="1278" rx="18" fill="#fbfcfe" stroke="#b9741d" stroke-width="1.7"/><text x="28" y="49" class="head" text-anchor="start">MSA Index Branch：为每个 query、每个索引组选择历史块</text><line x1="28" y1="75" x2="2652" y2="75" stroke="#b9741d" opacity=".35"/><rect x="130" y="1110" width="1370" height="68" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1342" x="815.0" y="1145" class="node" text-anchor="middle">输入 X [N,6144] + 位置 positions [N]</text><rect x="130" y="915" width="1370" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1342" x="815.0" y="950" class="node" text-anchor="middle">Index Q / K 线性投影 → GemmaRMSNorm → partial RoPE</text><text data-max-width="1342" x="815.0" y="985" class="body" text-anchor="middle">Q_idx [N,4,128]；K_idx [N,1,128]，共享 1 路 index K</text><polyline points="815,1110 815,1017" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1700" y="915" width="850" height="137" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="822" x="2125.0" y="950" class="node" text-anchor="middle">Index K Cache [T,1,128]（逻辑视图）</text><text data-max-width="822" x="2125.0" y="985" class="body" text-anchor="middle">写入当前 K_idx，保留已有历史 K_idx</text><text data-max-width="822" x="2125.0" y="1020" class="body" text-anchor="middle">T 为当前可见历史长度；按分页缓存存储</text><polyline points="1500,966 1700,966" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="130" y="680" width="1370" height="137" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1342" x="815.0" y="715" class="node" text-anchor="middle">逐组索引评分：s_g(t,j) = Q_idx[t,g] · K_idx[j]</text><text data-max-width="1342" x="815.0" y="750" class="body" text-anchor="middle">每个 query 有 4 路分数；逻辑 shape [N,4,T]</text><text data-max-width="1342" x="815.0" y="785" class="body" text-anchor="middle">屏蔽未来位置；实现可融合计算，无需物化完整分数矩阵</text><polyline points="815,915 815,817" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2125,915 2125,850 1550,850 1550,748 1500,748" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="130" y="475" width="1370" height="137" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1342" x="815.0" y="510" class="node" text-anchor="middle">Block Max Pooling：把 token 分数变成块分数</text><text data-max-width="1342" x="815.0" y="545" class="body" text-anchor="middle">S_g(t,b) = max（块 b 内有效位置的 s_g(t,j)）</text><text data-max-width="1342" x="815.0" y="580" class="body" text-anchor="middle">每 128 个位置一块；逻辑 shape [N,4,ceil(T/128)]</text><polyline points="815,680 815,612" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="130" y="290" width="1370" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1342" x="815.0" y="325" class="node" text-anchor="middle">各组独立选 Top-16 blocks + 强制 local block</text><text data-max-width="1342" x="815.0" y="360" class="body" text-anchor="middle">local=1，占用 Top-16 预算；短序列受有效块数限制</text><polyline points="815,475 815,392" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="130" y="105" width="1370" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1342" x="815.0" y="140" class="node" text-anchor="middle">输出 block 索引 [N,4,16]（逻辑容量）</text><text data-max-width="1342" x="815.0" y="175" class="body" text-anchor="middle">供主分支读取对应 K/V 块；索引分支不生成最终 attention 输出</text><polyline points="815,290 815,207" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1700" y="110" width="850" height="172" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="822" x="2125.0" y="145" class="node" text-anchor="middle">与普通因果 GQA 的关系</text><text data-max-width="822" x="2125.0" y="180" class="body" text-anchor="middle">普通 GQA：读取全部可见历史 K/V</text><text data-max-width="822" x="2125.0" y="215" class="body" text-anchor="middle">MSA：增加 Index Branch，先选块</text><text data-max-width="822" x="2125.0" y="250" class="body" text-anchor="middle">主分支再在选中块上计算注意力</text><text x="2125" y="360" class="node" text-anchor="middle">选块教学例：只画 1 个 query 的 1 路索引</text><text x="2125" y="405" class="body" text-anchor="middle">假设每块 2 个位置，预算为 2 块</text><rect x="1725" y="445" width="120" height="85" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1785" y="480" class="node" text-anchor="middle">B0</text><text x="1785" y="512" class="small" text-anchor="middle">0.3</text><rect x="1858" y="445" width="120" height="85" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="1918" y="480" class="node" text-anchor="middle">B1</text><text x="1918" y="512" class="small" text-anchor="middle">0.9</text><rect x="1991" y="445" width="120" height="85" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="2051" y="480" class="node" text-anchor="middle">B2</text><text x="2051" y="512" class="small" text-anchor="middle">0.2</text><rect x="2124" y="445" width="120" height="85" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="2184" y="480" class="node" text-anchor="middle">B3</text><text x="2184" y="512" class="small" text-anchor="middle">0.4</text><rect x="2257" y="445" width="120" height="85" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="2317" y="480" class="node" text-anchor="middle">B4</text><text x="2317" y="512" class="small" text-anchor="middle">0.5</text><rect x="2390" y="445" width="120" height="85" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="2450" y="480" class="node" text-anchor="middle">B5</text><text x="2450" y="512" class="small" text-anchor="middle">local</text><text x="2125" y="585" class="body" text-anchor="middle">保留 B1 + 当前 local B5；每块整体读取</text><text x="2125" y="635" class="body" text-anchor="middle">其他索引组独立评分，可选出不同块</text><text x="2125" y="715" class="body" text-anchor="middle">真实配置：block=128，4 路，Top-16 / 路</text><text x="2125" y="765" class="small" text-anchor="middle">分数与选块示例为教学数值，不是运行结果</text></g>
<text x="1400" y="1510" class="body" text-anchor="middle">Index Q/K 与主 attention Q/K 使用独立参数；Index K Cache 也与主 K/V Cache 分开。</text>
<text x="1400" y="1560" class="small" text-anchor="middle">N 为当前批次参与计算的 token 数；所有 shape 为未分片逻辑维度，缓存的实际布局与融合方式依后端实现。</text></svg>