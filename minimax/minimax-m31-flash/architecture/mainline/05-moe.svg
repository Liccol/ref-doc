<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img"><title>05-moe</title><rect width="900" height="900" fill="white"/><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs><rect x="1" y="1" width="898" height="898" rx="18" fill="#fbfcfe" stroke="#4b853e" stroke-width="1.7"/>
<text x="28" y="49" class="head" text-anchor="start">⑤ MoE：Router → MLP → 加权汇合</text>
<line x1="28" y1="75" x2="872" y2="75" stroke="#4b853e" opacity=".35"/>
<rect x="130" y="105" width="640" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="612" x="450.0" y="140" class="node" text-anchor="middle">路由加权和 + Shared → [N,6144]</text>
<circle cx="450" cy="220" r="20" fill="white" stroke="#617186" stroke-width="2"/>
<text x="450" y="228" class="node" text-anchor="middle">+</text>
<polyline points="450,200 450,173" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="270" width="400" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="372" x="235.0" y="305" class="node" text-anchor="middle">Routed MLP ×128</text>
<text data-max-width="372" x="235.0" y="340" class="body" text-anchor="middle">每 token 选择其中 Top-4</text>
<rect x="485" y="270" width="380" height="102" rx="10" fill="#eaf7f4" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="352" x="675.0" y="305" class="node" text-anchor="middle">Shared MLP ×1</text>
<text data-max-width="352" x="675.0" y="340" class="body" text-anchor="middle">每 token 无条件参与</text>
<polyline points="235,270 235,220 430,220" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="235" y="200" class="small" text-anchor="middle">Σ rₖ·MLPₖ ×2.0</text>
<polyline points="680,270 680,220 470,220" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="480" width="400" height="102" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="372" x="235.0" y="515" class="node" text-anchor="middle">Router</text>
<text data-max-width="372" x="235.0" y="550" class="body" text-anchor="middle">sigmoid + bias → Top-4</text>
<polyline points="235,480 235,372" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="230" y="700" width="440" height="68" rx="10" fill="#f0f7ec" stroke="#c9d4e0" stroke-width="1.7"/>
<text data-max-width="412" x="450.0" y="735" class="node" text-anchor="middle">输入 Z [N,6144]</text>
<polyline points="450,700 450,660 235,660 235,582" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="450,660 680,660 680,372" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="450" y="825" class="small" text-anchor="middle">r：原始 sigmoid 分数在选中专家内归一化。</text>
<text x="450" y="865" class="small" text-anchor="middle">共享专家绕过 Router，不占 Top-4，不乘路由缩放。</text></svg>