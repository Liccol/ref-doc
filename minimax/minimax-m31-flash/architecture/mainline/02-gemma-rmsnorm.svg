<text x="28" y="49" class="head" text-anchor="start">② GemmaRMSNorm：归一化幅度，再做可学习的逐通道缩放</text>
<line x1="28" y1="75" x2="2032" y2="75" stroke="#7758a6" opacity=".35"/>
<text x="50" y="125" class="body" text-anchor="start">y = x / sqrt(mean(x²) + ε) × (1+w)；ε=10⁻⁶；不减均值，输出 shape 不变。</text>
<text x="50" y="177" class="body" text-anchor="start">层内沿最后 6144 维计算；主 Q/K 和 index Q/K 则每 head 沿 128 维计算，权重各自独立。</text></svg>