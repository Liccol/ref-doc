.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs>
<text x="1400" y="65" class="title" text-anchor="middle">DSA 与 MSA：Index Branch 到底选什么、由谁共享？</text>
<text x="1400" y="115" class="body" text-anchor="middle">自下向上：输入 → 独立索引评分 → Top-K 选择 → Main Branch；数字是历史位置编号</text>
<g transform="translate(60,170)"><rect x="1" y="1" width="1298" height="1878" rx="18" fill="#fbfcfe" stroke="#447da5" stroke-width="1.7"/><text x="28" y="49" class="head" text-anchor="start">DSA / DeepSeek-V3.2</text><line x1="28" y1="75" x2="1272" y2="75" stroke="#447da5" opacity=".35"/><rect x="70" y="110" width="1160" height="137" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1132" x="650.0" y="145" class="node" text-anchor="middle">Main Branch：在选中的历史位置上计算 attention</text><text data-max-width="1132" x="650.0" y="180" class="body" text-anchor="middle">MLA / MQA：同一 query 的所有 Q heads 使用同一组选点</text><text data-max-width="1132" x="650.0" y="215" class="body" text-anchor="middle">共享索引集合，不表示各 Q heads 的 attention 权重相同</text><rect x="35" y="285" width="1230" height="1080" rx="14" fill="#ffffff" stroke="#b7c2cf" stroke-width="1.7" stroke-dasharray="8 6"/><text x="60" y="325" class="node" text-anchor="start">Index Branch</text><rect x="70" y="355" width="1160" height="550" rx="10" fill="#fbfcfe" stroke="#d0d8e2" stroke-width="1.7"/><text x="650" y="405" class="node" text-anchor="middle">选择单位：单个 token</text><text x="650" y="450" class="small" text-anchor="middle">示意采用相同预算：每个 Q head 最终读取 4 个历史位置</text><text data-max-width="100" x="85" y="566" class="small" text-anchor="start">head 0</text><rect x="190" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="222" y="566" class="small" text-anchor="middle">00</text><rect x="272" y="530" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="304" y="566" class="small" text-anchor="middle">01</text><rect x="354" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="386" y="566" class="small" text-anchor="middle">02</text><rect x="436" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="468" y="566" class="small" text-anchor="middle">03</text><rect x="518" y="530" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="550" y="566" class="small" text-anchor="middle">04</text><rect x="600" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="632" y="566" class="small" text-anchor="middle">05</text><rect x="682" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="714" y="566" class="small" text-anchor="middle">06</text><rect x="764" y="530" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="796" y="566" class="small" text-anchor="middle">07</text><rect x="846" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="878" y="566" class="small" text-anchor="middle">08</text><rect x="928" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="960" y="566" class="small" text-anchor="middle">09</text><rect x="1010" y="530" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="1042" y="566" class="small" text-anchor="middle">10</text><rect x="1092" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1124" y="566" class="small" text-anchor="middle">11</text><text data-max-width="100" x="85" y="721" class="small" text-anchor="start">head 1…</text><rect x="190" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="222" y="721" class="small" text-anchor="middle">00</text><rect x="272" y="685" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="304" y="721" class="small" text-anchor="middle">01</text><rect x="354" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="386" y="721" class="small" text-anchor="middle">02</text><rect x="436" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="468" y="721" class="small" text-anchor="middle">03</text><rect x="518" y="685" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="550" y="721" class="small" text-anchor="middle">04</text><rect x="600" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="632" y="721" class="small" text-anchor="middle">05</text><rect x="682" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="714" y="721" class="small" text-anchor="middle">06</text><rect x="764" y="685" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="796" y="721" class="small" text-anchor="middle">07</text><rect x="846" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="878" y="721" class="small" text-anchor="middle">08</text><rect x="928" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="960" y="721" class="small" text-anchor="middle">09</text><rect x="1010" y="685" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="1042" y="721" class="small" text-anchor="middle">10</text><rect x="1092" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1124" y="721" class="small" text-anchor="middle">11</text><text x="650" y="845" class="small" text-anchor="middle">两行选中相同位置：一组 token 索引由各 Q heads 共用</text><polyline points="650,355 650,247" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="1000" width="840" height="137" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1035" class="node" text-anchor="middle">多索引头点积 → ReLU → 加权聚合</text><text data-max-width="812" x="650.0" y="1070" class="body" text-anchor="middle">query 相关的权重把各索引头合成一个 token 分数</text><text data-max-width="812" x="650.0" y="1105" class="body" text-anchor="middle">得到“每个历史 token”的一个分数</text><polyline points="650,1000 650,905" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><text x="685" y="965" class="small" text-anchor="start">Top-K tokens</text><rect x="230" y="1190" width="840" height="102" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1225" class="node" text-anchor="middle">Index Q/K 投影 + query 相关的 head weights</text><text data-max-width="812" x="650.0" y="1260" class="body" text-anchor="middle">多个索引头参与评分，随后聚合成一组选择结果</text><polyline points="650,1190 650,1137" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="1480" width="840" height="68" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1515" class="node" text-anchor="middle">当前 query 的 hidden state + 历史上下文</text><polyline points="650,1480 650,1292" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="1640" width="1160" height="137" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1132" x="650.0" y="1675" class="node" text-anchor="middle">结构特点：细粒度 token 选择</text><text data-max-width="1132" x="650.0" y="1710" class="body" text-anchor="middle">本图对比 V3.2 的 DSA：同一 query 共用一组 Top-K token 索引。</text><text data-max-width="1132" x="650.0" y="1745" class="body" text-anchor="middle">允许从不同历史区域挑出分散的单个 token。</text></g>
<g transform="translate(1440,170)"><rect x="1" y="1" width="1298" height="1878" rx="18" fill="#fbfcfe" stroke="#b9741d" stroke-width="1.7"/><text x="28" y="49" class="head" text-anchor="start">MSA / MiniMax-M3.1</text><line x1="28" y1="75" x2="1272" y2="75" stroke="#b9741d" opacity=".35"/><rect x="70" y="110" width="1160" height="137" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1132" x="650.0" y="145" class="node" text-anchor="middle">Main Branch：在选中的历史位置上计算 attention</text><text data-max-width="1132" x="650.0" y="180" class="body" text-anchor="middle">GQA：每组 Q heads 使用各自选中的块</text><text data-max-width="1132" x="650.0" y="215" class="body" text-anchor="middle">同组共享选块结果，不同组可以不同</text><rect x="35" y="285" width="1230" height="1080" rx="14" fill="#ffffff" stroke="#b7c2cf" stroke-width="1.7" stroke-dasharray="8 6"/><text x="60" y="325" class="node" text-anchor="start">Index Branch</text><rect x="70" y="355" width="1160" height="550" rx="10" fill="#fbfcfe" stroke="#d0d8e2" stroke-width="1.7"/><text x="650" y="405" class="node" text-anchor="middle">选择单位：整个 block</text><text x="650" y="450" class="small" text-anchor="middle">示意采用相同预算：每个 Q head 最终读取 4 个历史位置</text><text data-max-width="100" x="85" y="566" class="small" text-anchor="start">GQA组0</text><rect x="184" y="518" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="260" y="625" class="small" text-anchor="middle">B0</text><rect x="348" y="518" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="424" y="625" class="small" text-anchor="middle">B1</text><rect x="512" y="518" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="588" y="625" class="small" text-anchor="middle">B2</text><rect x="676" y="518" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="752" y="625" class="small" text-anchor="middle">B3</text><rect x="840" y="518" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="916" y="625" class="small" text-anchor="middle">B4</text><rect x="1004" y="518" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="1080" y="625" class="small" text-anchor="middle">B5</text><rect x="190" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="222" y="566" class="small" text-anchor="middle">00</text><rect x="272" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="304" y="566" class="small" text-anchor="middle">01</text><rect x="354" y="530" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="386" y="566" class="small" text-anchor="middle">02</text><rect x="436" y="530" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="468" y="566" class="small" text-anchor="middle">03</text><rect x="518" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="550" y="566" class="small" text-anchor="middle">04</text><rect x="600" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="632" y="566" class="small" text-anchor="middle">05</text><rect x="682" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="714" y="566" class="small" text-anchor="middle">06</text><rect x="764" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="796" y="566" class="small" text-anchor="middle">07</text><rect x="846" y="530" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="878" y="566" class="small" text-anchor="middle">08</text><rect x="928" y="530" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="960" y="566" class="small" text-anchor="middle">09</text><rect x="1010" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1042" y="566" class="small" text-anchor="middle">10</text><rect x="1092" y="530" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1124" y="566" class="small" text-anchor="middle">11</text><text data-max-width="100" x="85" y="721" class="small" text-anchor="start">GQA组1</text><rect x="184" y="673" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="260" y="780" class="small" text-anchor="middle">B0</text><rect x="348" y="673" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="424" y="780" class="small" text-anchor="middle">B1</text><rect x="512" y="673" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="588" y="780" class="small" text-anchor="middle">B2</text><rect x="676" y="673" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="752" y="780" class="small" text-anchor="middle">B3</text><rect x="840" y="673" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="916" y="780" class="small" text-anchor="middle">B4</text><rect x="1004" y="673" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="1080" y="780" class="small" text-anchor="middle">B5</text><rect x="190" y="685" width="64" height="56" rx="10" fill="#a8bb8a" stroke="#c9d4e0" stroke-width="1.7"/><text x="222" y="721" class="small" text-anchor="middle">00</text><rect x="272" y="685" width="64" height="56" rx="10" fill="#a8bb8a" stroke="#c9d4e0" stroke-width="1.7"/><text x="304" y="721" class="small" text-anchor="middle">01</text><rect x="354" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="386" y="721" class="small" text-anchor="middle">02</text><rect x="436" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="468" y="721" class="small" text-anchor="middle">03</text><rect x="518" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="550" y="721" class="small" text-anchor="middle">04</text><rect x="600" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="632" y="721" class="small" text-anchor="middle">05</text><rect x="682" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="714" y="721" class="small" text-anchor="middle">06</text><rect x="764" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="796" y="721" class="small" text-anchor="middle">07</text><rect x="846" y="685" width="64" height="56" rx="10" fill="#a8bb8a" stroke="#c9d4e0" stroke-width="1.7"/><text x="878" y="721" class="small" text-anchor="middle">08</text><rect x="928" y="685" width="64" height="56" rx="10" fill="#a8bb8a" stroke="#c9d4e0" stroke-width="1.7"/><text x="960" y="721" class="small" text-anchor="middle">09</text><rect x="1010" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1042" y="721" class="small" text-anchor="middle">10</text><rect x="1092" y="685" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1124" y="721" class="small" text-anchor="middle">11</text><text x="650" y="845" class="small" text-anchor="middle">每组各选 2 块 × 每块 2 token（教学示意）</text><polyline points="650,355 650,247" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="1000" width="840" height="137" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1035" class="node" text-anchor="middle">每组独立评分 → 块内 Max Pooling</text><text data-max-width="812" x="650.0" y="1070" class="body" text-anchor="middle">先算 index Q · index K，再对块内位置取最大值</text><text data-max-width="812" x="650.0" y="1105" class="body" text-anchor="middle">得到“每组、每历史块”的分数</text><polyline points="650,1000 650,905" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><text x="685" y="965" class="small" text-anchor="start">Top-K blocks</text><rect x="230" y="1190" width="840" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1225" class="node" text-anchor="middle">独立 index Q/K 投影 → Norm &amp; RoPE</text><text data-max-width="812" x="650.0" y="1260" class="body" text-anchor="middle">M3.1：4 个 index Q heads，共享 1 个 index K head</text><polyline points="650,1190 650,1137" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="1480" width="840" height="68" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1515" class="node" text-anchor="middle">当前 query 的 hidden state + 历史上下文</text><polyline points="650,1480 650,1292" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="1640" width="1160" height="137" rx="10" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="1132" x="650.0" y="1675" class="node" text-anchor="middle">结构特点：按块、按 GQA 组选择</text><text data-max-width="1132" x="650.0" y="1710" class="body" text-anchor="middle">M3.1 实际配置：4 个组，每组 Top-16 个 128-token 块；local 必选。</text><text data-max-width="1132" x="650.0" y="1745" class="body" text-anchor="middle">每块整段读取；不同组能够关注不同的历史区域。</text></g>
<text x="1400" y="2120" class="body" text-anchor="middle">共同点：两者都有 Index Branch；主注意力只在选中位置计算。区别：token / block，以及跨全部头共享 / 按 GQA 组共享。</text>
<text x="1400" y="2180" class="small" text-anchor="middle">图中 12 个历史位置、2-token 块和 4 个位置的预算仅用于等预算示意；不是模型实测。MSA 实际 block=128。未对比速度。</text></svg>