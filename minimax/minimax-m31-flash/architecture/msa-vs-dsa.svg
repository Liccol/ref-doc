<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1610" viewBox="0 0 2800 1610">
<rect width="2800" height="1610" fill="white"/>
<style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#22364c}
.title{font-size:44px;font-weight:700}.head{font-size:31px;font-weight:700}
.node{font-size:25px;font-weight:600}.body{font-size:24px}.small{font-size:22px}
.weight{font-size:22px;fill:#59677a}.note{font-size:22px;fill:#59677a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#617186"/></marker></defs>
<text x="1400" y="65" class="title" text-anchor="middle">DSA 与 MSA：只看 Index Branch 的评分与选择</text>
<text x="1400" y="115" class="body" text-anchor="middle">自下向上：输入 → 索引投影 → 评分 → Top-K → 索引输出；不展开后续主注意力</text>
<g transform="translate(60,170)"><rect x="1" y="1" width="1298" height="1278" rx="18" fill="#fbfcfe" stroke="#447da5" stroke-width="1.7"/><text x="28" y="49" class="head" text-anchor="start">DSA / DeepSeek-V3.2</text><line x1="28" y1="75" x2="1272" y2="75" stroke="#447da5" opacity=".35"/><text x="60" y="100" class="node" text-anchor="start">Index Branch</text><rect x="70" y="125" width="1160" height="280" rx="10" fill="#fbfcfe" stroke="#c6d1de" stroke-width="1.7"/><text x="650" y="170" class="node" text-anchor="middle">输出：Top-K token 索引</text><text x="650" y="210" class="small" text-anchor="middle">各索引头先聚合，最终产生一组 token 索引</text><rect x="190" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="222" y="286" class="small" text-anchor="middle">00</text><rect x="272" y="250" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="304" y="286" class="small" text-anchor="middle">01</text><rect x="354" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="386" y="286" class="small" text-anchor="middle">02</text><rect x="436" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="468" y="286" class="small" text-anchor="middle">03</text><rect x="518" y="250" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="550" y="286" class="small" text-anchor="middle">04</text><rect x="600" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="632" y="286" class="small" text-anchor="middle">05</text><rect x="682" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="714" y="286" class="small" text-anchor="middle">06</text><rect x="764" y="250" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="796" y="286" class="small" text-anchor="middle">07</text><rect x="846" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="878" y="286" class="small" text-anchor="middle">08</text><rect x="928" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="960" y="286" class="small" text-anchor="middle">09</text><rect x="1010" y="250" width="64" height="56" rx="10" fill="#93b4d0" stroke="#c9d4e0" stroke-width="1.7"/><text x="1042" y="286" class="small" text-anchor="middle">10</text><rect x="1092" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="1124" y="286" class="small" text-anchor="middle">11</text><text x="650" y="385" class="small" text-anchor="middle">例：选位置 01、04、07、10</text><rect x="230" y="465" width="840" height="102" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="500" class="node" text-anchor="middle">Token Top-K</text><text data-max-width="812" x="650.0" y="535" class="body" text-anchor="middle">按 token 分数排序，保留重要的单个位置</text><polyline points="650,465 650,405" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="655" width="840" height="137" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="690" class="node" text-anchor="middle">多头点积 → ReLU → 加权聚合</text><text data-max-width="812" x="650.0" y="725" class="body" text-anchor="middle">score(token j) = Σ_h w_h · ReLU(q_h · k_j)</text><text data-max-width="812" x="650.0" y="760" class="body" text-anchor="middle">多个索引头合成每个 token 的一个分数</text><polyline points="650,655 650,567" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="880" width="840" height="102" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="915" class="node" text-anchor="middle">Index Q/K 投影 + query 相关的 head weights</text><text data-max-width="812" x="650.0" y="950" class="body" text-anchor="middle">多索引头参与评分，由权重决定如何聚合</text><polyline points="650,880 650,792" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="1100" width="840" height="68" rx="10" fill="#eef5fb" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1135" class="node" text-anchor="middle">输入 hidden state + 历史 index key</text><polyline points="650,1100 650,982" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/></g>
<g transform="translate(1440,170)"><rect x="1" y="1" width="1298" height="1278" rx="18" fill="#fbfcfe" stroke="#b9741d" stroke-width="1.7"/><text x="28" y="49" class="head" text-anchor="start">MSA / MiniMax-M3.1</text><line x1="28" y1="75" x2="1272" y2="75" stroke="#b9741d" opacity=".35"/><text x="60" y="100" class="node" text-anchor="start">Index Branch</text><rect x="70" y="125" width="1160" height="280" rx="10" fill="#fbfcfe" stroke="#c6d1de" stroke-width="1.7"/><text x="650" y="170" class="node" text-anchor="middle">输出：Top-K block 索引</text><text x="650" y="210" class="small" text-anchor="middle">只画其中一路索引；M3.1 实际有 4 路独立选块</text><rect x="184" y="238" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="260" y="350" class="small" text-anchor="middle">B0</text><rect x="348" y="238" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="424" y="350" class="small" text-anchor="middle">B1</text><rect x="512" y="238" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="588" y="350" class="small" text-anchor="middle">B2</text><rect x="676" y="238" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="752" y="350" class="small" text-anchor="middle">B3</text><rect x="840" y="238" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="916" y="350" class="small" text-anchor="middle">B4</text><rect x="1004" y="238" width="152" height="86" rx="8" fill="#ffffff" stroke="#98a4b5" stroke-width="1.7"/><text x="1080" y="350" class="small" text-anchor="middle">B5</text><rect x="190" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="222" y="286" class="small" text-anchor="middle">00</text><rect x="272" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="304" y="286" class="small" text-anchor="middle">01</text><rect x="354" y="250" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="386" y="286" class="small" text-anchor="middle">02</text><rect x="436" y="250" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="468" y="286" class="small" text-anchor="middle">03</text><rect x="518" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="550" y="286" class="small" text-anchor="middle">04</text><rect x="600" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="632" y="286" class="small" text-anchor="middle">05</text><rect x="682" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="714" y="286" class="small" text-anchor="middle">06</text><rect x="764" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="796" y="286" class="small" text-anchor="middle">07</text><rect x="846" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="878" y="286" class="small" text-anchor="middle">08</text><rect x="928" y="250" width="64" height="56" rx="10" fill="#edf0f4" stroke="#c9d4e0" stroke-width="1.7"/><text x="960" y="286" class="small" text-anchor="middle">09</text><rect x="1010" y="250" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="1042" y="286" class="small" text-anchor="middle">10</text><rect x="1092" y="250" width="64" height="56" rx="10" fill="#dfb56e" stroke="#c9d4e0" stroke-width="1.7"/><text x="1124" y="286" class="small" text-anchor="middle">11</text><text x="650" y="385" class="small" text-anchor="middle">例：选 B1 + local B5，包含块内全部 token</text><rect x="230" y="465" width="840" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="500" class="node" text-anchor="middle">Block Top-K + local 必选</text><text data-max-width="812" x="650.0" y="535" class="body" text-anchor="middle">按块分数排序，保留重要块和当前 local 块</text><polyline points="650,465 650,405" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="655" width="840" height="137" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="690" class="node" text-anchor="middle">逐路点积 → Block Max Pooling</text><text data-max-width="812" x="650.0" y="725" class="body" text-anchor="middle">score_g(block) = max_j∈block (q_g · k_j)</text><text data-max-width="812" x="650.0" y="760" class="body" text-anchor="middle">每个索引组分别得到每个 block 的分数</text><polyline points="650,655 650,567" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="880" width="840" height="102" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="915" class="node" text-anchor="middle">独立 index Q/K 投影 → Norm &amp; RoPE</text><text data-max-width="812" x="650.0" y="950" class="body" text-anchor="middle">4 路 index Q，共享 1 路 index K（M3.1）</text><polyline points="650,880 650,792" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="230" y="1100" width="840" height="68" rx="10" fill="#fff5e5" stroke="#c9d4e0" stroke-width="1.7"/><text data-max-width="812" x="650.0" y="1135" class="node" text-anchor="middle">输入 hidden state + 历史 index key</text><polyline points="650,1100 650,982" fill="none" stroke="#617186" stroke-width="2.2" marker-end="url(#arrow)"/></g>
<text x="1400" y="1510" class="body" text-anchor="middle">区别：DSA 把多索引头聚合成 token 分数；MSA 逐路计算块分数，输出 block 索引。</text>
<text x="1400" y="1560" class="small" text-anchor="middle">选取示例采用 12 个历史位置、2-token 块和 4 个候选位置，仅用于示意；M3.1 实际 block=128、Top-16 / 路，local 占预算。</text></svg>